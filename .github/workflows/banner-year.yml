name: Refresh the banner year

# The banner names the current year, so it has to be rewritten when the year
# turns. It runs monthly rather than every 1 January: the script is idempotent
# and commits nothing when the year has not moved, so a monthly run costs
# nothing and heals itself if one firing is missed.
#
# GitHub disables scheduled workflows on public repositories with no activity
# for 60 days. If that happens the banner goes stale by one year, which is a
# soft failure, and `workflow_dispatch` puts it right in one click.

on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: banner-year
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rewrite the years
        run: python3 scripts/update_banner_year.py

      - name: Commit if the year moved
        run: |
          if git diff --quiet -- assets/reproducible.svg README.md; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/reproducible.svg README.md
          git commit -m "Refresh the banner year"
          git push
